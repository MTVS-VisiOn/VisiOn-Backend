spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.test[.properties]
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
jwt:
  validations:
    access: 900000
    refresh: 604800000
    register: 900000