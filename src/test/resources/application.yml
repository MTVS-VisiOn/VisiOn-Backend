spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.test[.properties]
  sql:
    init:
      mode: never
  # DB를 쓰는 테스트는 PostgresContainerSupport를 상속해 Testcontainers로 실제 PostgreSQL을 띄운다.
  # datasource 접속 정보는 그쪽에서 @DynamicPropertySource로 주입한다.
  # 스키마는 Flyway가 만들고 Hibernate는 엔티티와 일치하는지 검증만 한다
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    aws:
      region:
        static: ap-northeast-2


jwt:
  validations:
    access: 900000   #밀리초 단위
    refresh: 604800000
    device: 43200000  #12시간

redis:
  expired:
    guardian-register: 900000
    device-register: 180000
    presence: 180  #초단위
    location: 30  #분단위
    navigation: 30  #분단위
    alert-cooldown: 60  #초단위
    alert-notified: 3600  #초단위

location:
  flush:
    interval: 30s
    batch-size: 1000
    max-loops: 10
    enabled: false   # 테스트에서 스케줄러가 멋대로 돌지 않게 한다. flush()는 직접 호출한다

presence:
  battery:
    thresholds: 20,10,5
  disconnect:
    threshold-seconds: 120
    enabled: false
alert:
  retry:
    max-attempts: 3        # FcmService 즉시 재시도 횟수
    expire-minutes: 5      # 이 시간을 넘긴 미발송 건은 서버가 재전송을 포기한다
    interval: 1m # 재전송 스케줄러 주기, 1분
    enabled: false
  push:
    ttl: 24h
    signal-ttl: 60s
    instruction-ttl: 30s
tmap:
  base-url: https://apis.openapi.sk.com
  app-key: test
s3:
  bucket-name: test
  access-key: test
  secret-key: test
firebase:
  # 테스트에서는 실제 Firebase를 띄우지 않는다. FirebaseMessaging은 @MockitoBean으로 대체한다
  enabled: false
init-data:
  password:
    ward: test
    guardian: test
vlm:
  base-url: test
  token: test