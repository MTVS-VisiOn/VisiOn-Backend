spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.test[.properties]
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    aws:
      region:
        static: ap-northeast-2
jwt:
  validations:
    access: 900000   #밀리초 단위
    refresh: 604800000
    register: 900000
redis:
  expired:
    presence: 180  #초단위
    location: 30  #분단위
    navigation: 30  #분단위
    alert-cooldown: 60  #초단위
    alert-notified: 3600  #초단위

tmap:
  base-url: https://apis.openapi.sk.com
  app-key: test
s3:
  bucket-name: test
  access-key: test
  secret-key: test
firebase:
  # 테스트에서는 실제 Firebase를 띄우지 않는다. FirebaseMessaging은 @MockitoBean으로 대체한다
  enabled: false
