springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
spring:
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    root: info
    "mtvs.onvision.vision.presence": ${LOG_LEVEL_PRESENCE:info}
    "org.hibernate.SQL": ${LOG_LEVEL_SQL:info}

server:
  forward-headers-strategy: framework