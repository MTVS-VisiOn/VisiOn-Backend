spring:
  application:
    name: vision
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.${spring.profiles.active}[.properties]
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
    web:
      pageable:
        serialization-mode: via_dto
  cloud:
    aws:
      region:
        static: ${S3_REGION}



jwt:
  validations:
    access: 900000
    refresh: 604800000
    register: 900000
  secrets:
    app-key: ${JWT_APP_KEY}
    origin-key: ${JWT_SECRET_KEY}
redis:
  expired:
    presence: 180  #초단위
    location: 30  #분단위
    navigation: 30  #분단위
    alert-cooldown: 60  #초단위
    alert-notified: 3600  #초단위
tmap:
  base-url: https://apis.openapi.sk.com
  app-key: ${TMAP_APP_KEY}

ice:
  stun-urls:
    - stun:stun.l.google.com:19302
  turn:
    urls:
      - turn:${TURN_HOST}:3478?transport=udp
      - turn:${TURN_HOST}:3478?transport=tcp
    secret: ${TURN_SECRET}
    ttl: 3600  #초단위
s3:
  bucket-name: ${S3_BUCKET_NAME}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
firebase:
  service-account:
    path: classpath:firebase/onvision-4cdc3-firebase-adminsdk-fbsvc-65c38117ac.json