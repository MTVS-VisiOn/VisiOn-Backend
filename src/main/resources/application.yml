spring:
  application:
    name: vision
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.${spring.profiles.active}[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true  #flyway 설정
    locations: classpath:db/migration    #flyway가 참조할 migration파일의 디렉토리 경로
    baseline-on-migrate: false    #현재 DB상태를 기준선 버전으로 등록하고 그 이전 migration을 이미 적용된 것처럼 간주하여 적용x
    validate-on-migrate: true     #적용된 migration의 체크섬이 파일과 일치하는지 검증
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
    web:
      pageable:
        serialization-mode: via_dto
  cloud:
    aws:
      region:
        static: ${S3_REGION}



jwt:
  validations:
    access: 900000
    refresh: 604800000
    device: 43200000  #12시간

  secrets:
    app-key: ${JWT_APP_KEY}
    origin-key: ${JWT_SECRET_KEY}
redis:
  expired:
    guardian-register: 900000
    device-register: 180000
    presence: 180  #초단위
    location: 30  #분단위
    navigation: 30  #분단위
    alert-cooldown: 60  #초단위
    alert-notified: 3600  #초단위

presence: #배터리 부족 기준
  battery:
    thresholds: 20,10,5
  disconnect:
    threshold-seconds: 120
    interval: 30s
    enabled: true
alert:
  retry:
    max-attempts: 3        # FcmService 즉시 재시도 횟수
    expire-minutes: 5      # 이 시간을 넘긴 미발송 건은 서버가 재전송을 포기한다
    interval: 1m # 재전송 스케줄러 주기, 1분
  push:
    # FCM이 오프라인 기기용으로 쌓아두는 기간. 서버 재시도와 다른 층이다.
    # 미설정 시 기본이 4주라 길고, 하루 넘게 꺼져 있었으면 알림 목록으로 보면 된다
    ttl: 24h

tmap:
  base-url: https://apis.openapi.sk.com
  app-key: ${TMAP_APP_KEY}

ice:
  stun-urls:
    - stun:stun.l.google.com:19302
  turn:
    urls:
      - turn:${TURN_HOST}:3478?transport=udp
      - turn:${TURN_HOST}:3478?transport=tcp
    secret: ${TURN_SECRET}
    ttl: 3600  #초단위
s3:
  bucket-name: ${S3_BUCKET_NAME}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
firebase:
  service-account:
    path: ${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase/onvision-4cdc3-firebase-adminsdk-fbsvc-65c38117ac.json}
init-data:
  password:
    ward: ${PASSWORD_WARD}
    guardian: ${PASSWORD_GUARDIAN}
location:
  flush:  # Redis 버퍼 → DB 배치 INSERT
    interval: 30s
    batch-size: 1000
    max-loops: 10   # 한 틱에 최대 10,000건. 유입이 이걸 넘으면 로그에 경고가 남는다
    enabled: true
