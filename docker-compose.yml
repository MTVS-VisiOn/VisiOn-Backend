name: onvision

services:
  db:
    image: postgres:latest
    container_name: onvision-postgres

    env_file:
      - .env.dev

    ports:
      - "5432:5432"
    networks:
      - onvision_network
    volumes:
      - onvision-data:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: onvision-redis
    ports:
      - "6379:6379"
    networks:
      - onvision_network

volumes:
  onvision-data:
networks:
  onvision_network:
    driver: bridge